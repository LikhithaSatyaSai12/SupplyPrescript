<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SupplyPrescript</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<header>

<h1>🚚 SupplyPrescript</h1>

<p>AI Powered Supply Chain Optimization Dashboard</p>

<p id="datetime"></p>

</header>


<div class="dashboard">

<div class="left-panel">

<h2>Shipment Details</h2>

<label>Shipment ID</label>
<input type="number" id="shipment">

<label>Supplier</label>

<select id="supplier">

<option>Supplier A</option>
<option>Supplier B</option>
<option>Supplier C</option>
<option>Supplier D</option>

</select>

<label>Distance (KM)</label>
<input type="number" id="distance">

<label>Lead Time (Days)</label>
<input type="number" id="lead">

<label>Weather</label>

<select id="weather">

<option>Clear</option>
<option>Cloudy</option>
<option>Rain</option>
<option>Storm</option>

</select>

<label>Inventory</label>
<input type="number" id="inventory">

<label>Transport Cost</label>
<input type="number" id="cost">

<button onclick="predictDelay()">Predict Delay</button>
<button onclick="resetForm()">Reset</button>

</div>


<div class="right-panel">

<div class="card">

<h2>Prediction</h2>

<h3 id="prediction">
No Prediction
</h3>

<p id="risk">
Risk Level
</p>

</div>


<div class="card">

<h2>Optimization Recommendation</h2>

<ul>

<li id="supplierRec">Best Supplier :</li>

<li id="routeRec">Recommended Route :</li>

<li id="savingRec">Estimated Savings :</li>

<li id="inventoryRec">Inventory Action :</li>

</ul>

</div>

<div class="card">

<h2>Shipment History</h2>

<table id="historyTable">

<thead>

<tr>

<th>Shipment ID</th>
<th>Supplier</th>
<th>Prediction</th>
<th>Risk</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
